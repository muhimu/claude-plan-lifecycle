<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="An old head and a new head on one line of commits, and the earlier stops sorted into resolved, still open and new">
  <path d="M20 28h200" stroke="var(--line)" stroke-width="4"/>
  <circle cx="40" cy="28" r="9" fill="var(--surface)" stroke="var(--muted)"/>
  <circle cx="120" cy="28" r="6" fill="var(--line)" stroke="none"/>
  <circle cx="200" cy="28" r="9" fill="var(--accent-soft)" stroke="var(--accent)"/>
  <g stroke="none" fill="currentColor" font-size="10" text-anchor="middle"><text x="40" y="54" fill="var(--muted)">last guide</text><text x="200" y="54" fill="var(--accent)">now</text></g>
  <circle cx="30" cy="80" r="8" fill="var(--green-soft)" stroke="var(--green)"/>
  <path d="M26 80l3 3l5 -6" stroke="var(--green)"/>
  <circle cx="30" cy="102" r="8" fill="var(--amber-soft)" stroke="var(--amber)"/>
